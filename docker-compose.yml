version: "3.8"

services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3000:3000"
    env_file:
      - ./auth-service/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mepply-network

  mongo:
    image: mongo:6.0
    container_name: auth-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db
      - ./auth-service/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - mepply-network

  redis:
    image: redis:7
    container_name: auth-redis
    ports:
      - "6380:6379"
    networks:
      - mepply-network

  knowledge-base-service:
    build: ./knowledge-base-service
    container_name: knowledge-base-service
    ports:
      - "5000:5000"
    env_file:
      - ./knowledge-base-service/.env
    networks:
      - mepply-network
    depends_on:
      - auth-service

volumes:
  mongo-data:
    driver: local

networks:
  mepply-network:
    external: true
