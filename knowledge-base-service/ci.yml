name: CI Pipeline

on:
  push:
    branches:
      - feature/knowledge-base
  pull_request:
    branches:
      - feature/knowledge-base

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MONGODB_METADATA_URI: "mongodb://localhost:27017/file_metadata_db"
          MONGODB_STORAGE_URI: "mongodb://localhost:27017/file_storage_db"
        run: pytest --disable-warnings
